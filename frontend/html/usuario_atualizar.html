    </header>
    <main>
        <h1>Atualizar Usuario</h1>
        <div class="container">
            <h2>Buscar Usuario pelo ID</h2>
            <label for="id">ID do Usuario</label>
            <div class="flex-row mt-4">
                <input type="number" id="id" placeholder="Ex: 1" style="max-width: 180px;">
                <button id="btn_buscar" class="btn-neutral">Buscar</button>
            </div>

            <div id="form_atualizar" style="display: none; flex-direction: column; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #ddd;">
                <label for="nome">Nome</label>
                <input type="text" id="nome">

                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome">

                <label for="email">E-mail</label>
                <input type="email" id="email">

                <label for="telefone">Telefone</label>
                <input type="text" id="telefone">

                <button id="btn_atualizar">Salvar Atualizacao</button>
            </div>

            <div id="resposta" class="resposta"></div>
        </div>
    </main>
</body>
