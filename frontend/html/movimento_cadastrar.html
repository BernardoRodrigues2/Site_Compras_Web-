<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/movimento_cadastrar.js" defer></script>
    <title>Registrar Compra</title>
</head>
<body>
    <header>
        <nav>
            <span class="logo">Compras Interno</span>
            <a href="../index.html">Home</a>
            <span class="sep">Usuarios</span>
            <a href="./usuario_cadastrar.html">Cadastrar / Lote</a>
            <a href="./usuario_listar.html">Listar</a>
            <a href="./usuario_consultar.html">Consultar</a>
            <a href="./usuario_atualizar.html">Atualizar</a>
            <a href="./usuario_apagar.html">Apagar</a>
            <span class="sep">Produtos</span>
            <a href="./produto_cadastrar.html">Cadastrar / Lote</a>
            <a href="./produto_listar.html">Listar</a>
            <a href="./produto_consultar.html">Consultar</a>
            <a href="./produto_atualizar.html">Atualizar</a>
            <a href="./produto_apagar.html">Apagar</a>
            <a href="./produto_dashboard.html">Dashboard</a>
            <span class="sep">Operacoes</span>
            <a href="./movimento_cadastrar.html" class="active">Registrar Compra</a>
            <a href="./movimento_listar.html">Historico</a>
            <a href="./mov_categoria_listar.html">Rel. Volume</a>
            <a href="./mov_historico_saida.html">Rel. Criticos</a>
        </nav>
    </header>
    <main>
        <h1>Registrar Movimentacao</h1>
        <div class="container">
            <h2>Formulario de Compra / Venda</h2>
            <form id="form_compra">
                <label for="idUsuario">ID do Usuario</label>
                <input type="number" id="idUsuario" required>

                <label for="idProduto">ID do Produto</label>
                <input type="number" id="idProduto" required>

                <label for="tipoMovimento">Tipo de Movimentacao</label>
                <select id="tipoMovimento" required>
                    <option value="SAIDA">Venda / Saida (SAIDA)</option>
                    <option value="ENTRADA">Reposicao / Entrada (ENTRADA)</option>
                </select>

                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" required min="1">

                <label for="desconto">Desconto Aplicado (%)</label>
                <input type="number" id="desconto" value="0" min="0" max="100">

                <label for="formaPagamento">Forma de Pagamento</label>
                <select id="formaPagamento" required>
                    <option value="CREDITO">Cartao de Credito</option>
                    <option value="DEBITO">Cartao de Debito</option>
                    <option value="DINHEIRO">Dinheiro / Pix</option>
                </select>

                <label for="statusCompra">Status da Compra</label>
                <select id="statusCompra" required>
                    <option value="PAGA">PAGA</option>
                    <option value="PENDENTE">PENDENTE</option>
                </select>

                <button id="btn_cadastrar" class="btn-accent">Registrar Operacao</button>
            </form>
            <div id="resposta" class="resposta"></div>
        </div>
    </main>
</body>
</html>
